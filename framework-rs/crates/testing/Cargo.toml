[package]
description = "ForkLaunch Rust testing APIs and runtime support"
name = "forklaunch-testing"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
benchmarks = ["dep:anyhow", "dep:axum", "dep:tokio", "dep:reqwest", "dep:serde", "dep:serde_json", "dep:garde", "dep:schemars", "dep:forklaunch-axum", "dep:forklaunch-validator", "dep:forklaunch-ws", "dep:forklaunch-infrastructure-redis", "dep:forklaunch-infrastructure-s3", "forklaunch-core/codegen", "forklaunch-core/typescript"]

[[example]]
name = "runtime_benchmarks"
required-features = ["benchmarks"]

[dependencies]
forklaunch-core = { version = "0.2.5", path = "../core", features = ["codegen", "typescript"]}

anyhow = { version = "1", optional = true }
axum = { version = "0.8", features = ["ws"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "=1.0.151", optional = true }
garde = { version = "0.23", features = ["derive"], optional = true }
schemars = { version = "1.2", optional = true }
forklaunch-axum = { version = "0.2.5", path = "../axum", features = ["websocket"], optional = true }
forklaunch-validator = { version = "0.2.5", path = "../validator", optional = true }
forklaunch-ws = { version = "0.2.5", path = "../ws", features = ["transport"], optional = true }
forklaunch-infrastructure-redis = { version = "0.2.5", path = "../redis", features = ["redis-client"], optional = true }
forklaunch-infrastructure-s3 = { version = "0.2.5", path = "../s3", features = ["aws-sdk"], optional = true }

[lints]
workspace = true

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
