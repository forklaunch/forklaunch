[package]
name = "forklaunch-universal-sdk"
description = "Shared native HTTP SDK transport and checked response runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
zod-regex = ["forklaunch-core/zod-regex"]
zod-checks = ["forklaunch-core/zod-checks"]
zod-uri = ["forklaunch-core/zod-uri"]

[dependencies]
forklaunch-core = { version = "0.2.4", path = "../core", features = ["http", "date-codec", "auth"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
futures-util = "0.3"
multer = "3"
http-body-util = "0.1"
tokio = { version = "1", features = ["time"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
axum = "0.8"

[lints]
workspace = true
