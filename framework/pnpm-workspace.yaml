packages:
  - common
  - core
  - express
  - hyper-express
  - universal-sdk
  - validator
  - testing
  - e2e-tests
  - infrastructure/redis
  - infrastructure/S3
  - internal
  - bunrun
  - ws

blockExoticSubdeps: false

allowBuilds:
  '@parcel/watcher': false
  "@scarf/scarf": true
  cpu-features: true
  esbuild: true
  protobufjs: true
  ssh2: true
  tldjs: true
  unrs-resolver: true

overrides:
  fast-uri@>=3.0.0 <3.1.9: ^3.1.9
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
