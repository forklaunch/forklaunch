[[bin]]
name = "jobs"
path = "main.rs"

[[bin]]
name = "jobs-worker"
path = "worker.rs"

[build-dependencies]
serde_json = "1"
zeroize = "1"

[build-dependencies.contracts]
package = "jobs-contracts"
path = ".forklaunch/contracts"

[build-dependencies.forklaunch-core]
features = [
    "compliance-artifact",
    "typed-schema",
    "build",
    "encryption",
]
version = "=0.2.2"

[build-dependencies.forklaunch-worker-interface]
features = ["schema"]
package = "forklaunch-worker-interface"
version = "=0.2.2"

[build-dependencies.schemars]
features = ["uuid1"]
version = "1"

[build-dependencies.serde]
features = ["derive"]
version = "1"

[build-dependencies.uuid]
features = ["serde"]
version = "1"

[dependencies]
apalis = "=1.0.0"
apalis-core = "=1.0.0"
apalis-postgres = "=1.0.0"
axum = "0.8"
serde_json = "1"
zeroize = "1"

[dependencies.contracts]
package = "jobs-contracts"
path = ".forklaunch/contracts"

[dependencies.forklaunch-axum]
default-features = false
features = [
    "native-server",
    "native-jwt",
]
version = "=0.2.2"

[dependencies.forklaunch-core]
features = [
    "typed-schema",
    "openapi",
    "http",
    "otlp",
    "postgres",
    "encryption",
]
version = "=0.2.2"

[dependencies.forklaunch-worker-interface]
features = [
    "native",
    "apalis",
    "telemetry",
    "schema",
]
package = "forklaunch-worker-interface"
version = "=0.2.2"

[dependencies.schemars]
features = ["uuid1"]
version = "1"

[dependencies.serde]
features = ["derive"]
version = "1"

[dependencies.sqlx]
default-features = false
features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
]
version = "0.9"

[dependencies.tokio]
features = [
    "macros",
    "rt-multi-thread",
    "net",
    "signal",
    "time",
]
version = "1"

[dependencies.uuid]
features = [
    "v4",
    "serde",
]
version = "1"

[dev-dependencies.tower]
features = ["util"]
version = "0.5"

[lib]
path = "lib.rs"

[package]
autotests = false
default-run = "jobs"
description = "Jobs"
name = "jobs"

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.license]
workspace = true

[package.version]
workspace = true

[[test]]
name = "http"
path = "__test__/http.rs"
