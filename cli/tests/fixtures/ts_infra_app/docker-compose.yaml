# Generated by ForkLaunch
# File: docker-compose.yaml
#
# Edited by hand since: images are pinned on purpose, and the settings every
# service shares live in one anchored block.

x-common-environment: &common-environment
  NODE_ENV: development
  OTEL_LEVEL: info # raise to debug when chasing a trace
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

volumes:
  # Kept between runs; `docker volume rm` to start clean.
  demo-postgresql-data:
  redis-data:

networks:
  demo-network:
    name: demo-network
    driver: bridge

services:
  redis:
    image: redis/redis-stack-server:7.4.0-v1 # pinned 2026-11-19
    container_name: demo-redis
    networks:
      - demo-network

  # The HTTP API.
  api:
    container_name: demo-api
    build:
      context: .
      dockerfile: ./Dockerfile
    networks:
      - demo-network
    environment:
      <<: *common-environment
      PORT: "8000" # the port the load balancer expects
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started

  # The jobs worker runs as two containers that share one environment block.
  jobs-server:
    container_name: demo-jobs-server
    build:
      context: .
      dockerfile: ./Dockerfile
    networks: [demo-network]
    environment: &jobs-environment
      <<: *common-environment
      PORT: "8001"
      QUEUE_NAME: demo-jobs-queue
      REDIS_URL: redis://redis:6379/1
    command: |
      # Migrations are another job's; this one only serves.
      node dist/server.js

  jobs-worker:
    container_name: demo-jobs-worker
    build:
      context: .
      dockerfile: ./Dockerfile
    networks: [demo-network]
    environment:
      <<: *jobs-environment
      WORKER_CONCURRENCY: "4"

  # Storage of its own: an S3 endpoint outside this stack.
  files:
    container_name: demo-files
    build:
      context: .
      dockerfile: ./Dockerfile
    networks:
      - demo-network
    environment:
      <<: *common-environment
      PORT: "8002"
      S3_URL: http://host.docker.internal:9100
      S3_BUCKET: demo-shared-files
