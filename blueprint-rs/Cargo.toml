[workspace]
resolver = "3"
exclude = []
members = [
    "crates/interfaces/iam-interface",
    "crates/interfaces/cac-interface",
    "crates/interfaces/ecommerce-interface",
    "crates/interfaces/billing-interface",
    "crates/interfaces/worker-interface",
    "crates/implementations/iam/iam-base",
    "crates/implementations/cac/cac-base",
    "crates/implementations/ecommerce/ecommerce-base",
    "crates/implementations/ecommerce/ecommerce-stripe",
    "crates/implementations/ecommerce/ecommerce-paypal",
    "crates/implementations/billing/billing-base",
    "crates/implementations/billing/billing-stripe",
    "crates/implementations/worker/worker-database",
    "crates/implementations/worker/worker-redis",
    "crates/implementations/worker/worker-kafka",
]

[workspace.package]
version = "0.2.5"
edition = "2024"
license = "ISC"
authors = ["Forklift Technologies, Inc. <engineering@forklaunch.com>"]
repository = "https://github.com/forklaunch/forklaunch-js"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Implementations satisfy async traits even when one has nothing to await.
unused_async_trait_impl = "allow"
# Rust 1.99: `assert!(x.is_empty())` reads better than its suggested rewrite.
assert_is_empty = "allow"

