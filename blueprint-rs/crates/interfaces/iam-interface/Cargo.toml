[package]
description = "ForkLaunch Rust iam interface APIs and runtime support"
name = "forklaunch-iam-interface"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
forklaunch-core = { version = "=0.2.4", path = "../../../../framework-rs/crates/core", features = ["http", "domain"] }
serde = { version = "1", features = ["derive"] }

schemars = { version = "1.2", features = ["chrono04"] }
