[package]
description = "ForkLaunch Rust cac base APIs and runtime support"
name = "forklaunch-cac-base"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
# Contract-bound HTTP handlers for generated CAC services.
http = ["forklaunch-core/auth", "forklaunch-core/remote-jwks", "dep:forklaunch-axum", "dep:axum", "dep:serde_json"]

[dependencies]
forklaunch-cac-interface = { version = "=0.2.5", path = "../../../interfaces/cac-interface" }
forklaunch-core = { version = "=0.2.5", path = "../../../../../framework-rs/crates/core", features = ["http", "domain"] }
forklaunch-axum = { version = "=0.2.5", path = "../../../../../framework-rs/crates/axum", features = ["remote-jwks"], optional = true }
axum = { version = "0.8", optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
