[package]
description = "ForkLaunch Rust billing base APIs and runtime support"
name = "forklaunch-billing-base"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
postgres = ["forklaunch-core/postgres", "forklaunch-core/encryption", "forklaunch-core/http", "dep:sqlx", "dep:tokio", "dep:sha2"]

[dependencies]
forklaunch-validator = { version = "=0.2.4", path = "../../../../../framework-rs/crates/validator" }
sha2 = { version = "0.11", optional = true }
forklaunch-billing-interface = { version = "=0.2.4", path = "../../../interfaces/billing-interface" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
forklaunch-core = { version = "=0.2.4", path = "../../../../../framework-rs/crates/core", features = ["domain"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "migrate", "macros"], optional = true }

tokio = { version = "1", default-features = false, features = ["sync"], optional = true }
base16ct = { version = "1", features = ["alloc"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[lints]
workspace = true
