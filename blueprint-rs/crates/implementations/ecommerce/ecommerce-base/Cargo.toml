[package]
description = "ForkLaunch Rust ecommerce base APIs and runtime support"
name = "forklaunch-ecommerce-base"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
worker = ["dep:forklaunch-worker-interface", "dep:forklaunch-worker-database"]
postgres = ["forklaunch-core/postgres", "forklaunch-core/encryption", "dep:sqlx", "forklaunch-worker-database?/postgres"]

[dependencies]
forklaunch-worker-interface = { version = "=0.2.5", path = "../../../interfaces/worker-interface", optional = true }
forklaunch-worker-database = { version = "=0.2.5", path = "../../worker/worker-database", features = ["runtime"], optional = true }
forklaunch-ecommerce-interface = { version = "=0.2.5", path = "../../../interfaces/ecommerce-interface" }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
regex = "1"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"
forklaunch-core = { version = "=0.2.5", path = "../../../../../framework-rs/crates/core", features = ["http", "domain"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "migrate", "macros"], optional = true }

[dev-dependencies]
forklaunch-worker-database = { version = "=0.2.5", path = "../../worker/worker-database", features = ["runtime", "postgres"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[lints]
workspace = true
