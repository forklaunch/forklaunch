[package]
description = "ForkLaunch Rust ecommerce paypal APIs and runtime support"
name = "forklaunch-ecommerce-paypal"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
postgres = ["forklaunch-ecommerce-base/postgres", "dep:uuid"]

[dependencies]
forklaunch-core = { version = "=0.2.5", path = "../../../../../framework-rs/crates/core", features = ["http", "domain", "provider-http"] }
uuid = { version = "1", features = ["v4"], optional = true }
forklaunch-ecommerce-interface = { version = "=0.2.5", path = "../../../interfaces/ecommerce-interface" }
forklaunch-ecommerce-base = { version = "=0.2.5", path = "../ecommerce-base" }
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
tracing = "0.1"

[dev-dependencies]
forklaunch-core = { version = "=0.2.5", path = "../../../../../framework-rs/crates/core", features = ["postgres", "encryption"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
axum = "0.8"

[lints]
workspace = true
