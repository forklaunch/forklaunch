[package]
description = "ForkLaunch Rust worker database APIs and runtime support"
name = "forklaunch-worker-database"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
http-control = ["runtime", "dep:axum", "dep:subtle", "dep:serde_json", "tokio/net"]
runtime = ["dep:tokio", "dep:futures-util"]
postgres = ["dep:sqlx", "forklaunch-core/postgres", "forklaunch-core/http", "dep:serde_json", "dep:uuid"]

[dependencies]
axum = { version = "0.8", optional = true }
subtle = { version = "2", optional = true }
forklaunch-worker-interface = { version = "=0.2.5", path = "../../../interfaces/worker-interface" }

forklaunch-core = { version = "=0.2.5", path = "../../../../../framework-rs/crates/core", features = ["domain"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "uuid", "migrate", "macros"], optional = true }
serde_json = { version = "1", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"], optional = true }

futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
forklaunch-iam-base = { version = "=0.2.5", path = "../../iam/iam-base", features = ["postgres"] }

[lints]
workspace = true
