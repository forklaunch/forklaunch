<!doctype html><html><head><meta charset="utf-8"><title>Signing in</title></head><body><p id="status">Completing sign-in…</p><script>(async()=>{const params=new URLSearchParams(location.search);history.replaceState(null,"",location.pathname);try{const code=params.get("code"),state=params.get("state");if(params.get("error")||params.getAll("code").length!==1||params.getAll("state").length!==1||!code||!state||code.length>16384||state.length>1024)throw Error();const csrf=await fetch("/auth/browser/csrf",{credentials:"same-origin",cache:"no-store"});if(!csrf.ok)throw Error();const proof=await csrf.json();const result=await fetch("/auth/browser/oidc/callback",{method:"POST",credentials:"same-origin",cache:"no-store",headers:{"content-type":"application/json","x-csrf-token":proof.csrfToken},body:JSON.stringify({code,state})});if(!result.ok)throw Error();location.replace("/");}catch{document.getElementById("status").textContent="Sign-in failed. Please start again."}})();</script></body></html>
