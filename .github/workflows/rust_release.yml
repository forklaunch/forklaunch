# Release train for the Rust crates: framework-rs (tag rust-vVERSION), then
# blueprint-rs (tag rust-blueprint-vVERSION). Both share one version because
# the blueprint pins exact framework versions.
#
#   stage=version  from main: `rust_release.py bump` moves both workspaces,
#                  every path pin and the lockfiles to `version`, then pushes
#                  release/rust-VERSION and opens a PR (or prints the link when
#                  Actions may not open PRs). The CLI stays on the published
#                  version, so nothing in the PR needs an unpublished crate.
#   merge          a push to main that moves a workspace version with no tag yet
#                  starts stage=release publish=true for the framework. Its
#                  success starts the blueprint, whose success pushes
#                  release/cli-rust-VERSION moving the CLI to the new crates.
#   stage=release  verify one scope. publish=true, from main: create the scope's
#                  tag and GitHub release on the verified commit if missing,
#                  then upload in dependency order. Framework first; the
#                  blueprint verifies against the framework on crates.io.
#                  Dispatching it by hand resumes a release that stopped.
#
# Secrets: CARGO_REGISTRY_TOKEN, or the organization's CARGO_TOKEN. Optional
# RELEASE_PR_TOKEN so CI runs on the version PR.
name: Rust Crate Release

on:
  push:
    branches: [main]
    paths:
      - 'framework-rs/Cargo.toml'
      - 'blueprint-rs/Cargo.toml'
  pull_request:
    paths:
      - 'framework-rs/**'
      - 'blueprint-rs/**'
      - 'scripts/rust_release.py'
      - 'scripts/rust_registry.py'
      - 'scripts/rust_registry_smoke.rs'
      - 'scripts/rust_feature_matrix.py'
      - 'scripts/test_rust_release.py'
      - 'cli/tests/fixtures/rust_mcp_service_startup.mjs'
      - 'cli/tests/fixtures/rust_mcp_probe.mjs'
      - '.github/workflows/rust_release.yml'
  workflow_dispatch:
    inputs:
      stage:
        description: 'version = open the version PR for both workspaces; release = verify (and optionally publish) one scope'
        type: choice
        options: [release, version]
        default: release
      version:
        description: 'stage=version only: new shared framework/blueprint version (e.g. 0.2.6)'
        type: string
        default: ''
      scope:
        description: 'Workspace to release: framework (tag rust-vVERSION) or blueprint (tag rust-blueprint-vVERSION, after its framework versions are on crates.io)'
        type: choice
        options: [framework, blueprint]
        default: framework
      publish:
        description: 'stage=release only: upload to crates.io. From main the tag and GitHub release are created on the verified commit; from an existing tag that tag is used'
        type: boolean
        default: false
      reuse_verified_release_tag:
        description: 'Optional prior public rust-vVERSION release for unchanged package versions (crates.io archives are reused automatically); fresh packaged contents must match'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: rust-crate-release-${{ inputs.scope || 'pr' }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'

jobs:
  start:
    # A merged version PR. An existing tag means this version already went out.
    if: github.event_name == 'push' && !github.event.repository.fork
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Publish a version that has no tag yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import sys; sys.path.insert(0, 'scripts'); import rust_release as r; print(r.scope_version('framework'))")
          if [ -n "$(git ls-remote --tags origin "refs/tags/rust-v$version")" ]; then
            echo "rust-v$version exists; nothing to release"
            exit 0
          fi
          gh workflow run rust_release.yml --ref main -f stage=release -f scope=framework -f publish=true

  version:
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'version' && github.ref == 'refs/heads/main' && !github.event.repository.fork
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bump framework-rs and blueprint-rs together
        run: python3 scripts/rust_release.py bump --version "$VERSION"
      - name: Refresh lockfiles
        run: |
          for manifest in framework-rs/Cargo.toml blueprint-rs/Cargo.toml cli/Cargo.toml; do
            cargo metadata --format-version 1 --manifest-path "$manifest" > /dev/null
          done
      - name: Release graph is consistent
        run: |
          python3 scripts/rust_release.py plan --scope framework > /dev/null
          python3 scripts/rust_release.py plan --scope blueprint > /dev/null
          (cd .github/workflows/scripts/check_blueprint_deps && cargo run --quiet)
      - name: Only release files changed
        run: |
          outside=$(git status --porcelain -- . ':(exclude)framework-rs' ':(exclude)blueprint-rs' ':(exclude)cli/Cargo.lock')
          if [ -n "$outside" ]; then
            echo "::error::the version bump changed files outside the release set:"
            echo "$outside"
            exit 1
          fi
      - name: Push the branch and open the version PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
        run: |
          branch="release/rust-$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add -A
          git commit -m "chore(release): Rust crates $VERSION" -m "rust_release.py bump by $GITHUB_WORKFLOW run $GITHUB_RUN_ID."
          git push origin "$branch"
          {
            echo "Generated by [$GITHUB_WORKFLOW run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) from \`$GITHUB_SHA\`: \`rust_release.py bump --version $VERSION\` and a lockfile refresh. Nothing in it was edited by hand."
            echo
            echo "**Merging this publishes $VERSION to crates.io**: the framework, then the blueprint. The run then pushes \`release/cli-rust-$VERSION\`, which moves the CLI to the new crates."
            echo
            echo '```'
            git show --stat --format= HEAD
            echo '```'
          } > "$RUNNER_TEMP/pr-body.md"
          if ! gh pr create --base main --head "$branch" --title "chore(release): Rust crates $VERSION" --body-file "$RUNNER_TEMP/pr-body.md"; then
            echo "::warning::Actions may not open pull requests here. Open it from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch"
          fi

  verify:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.stage == 'release')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Pull requests verify both workspaces; a dispatch verifies the scope it releases.
        scope: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.scope) || '["framework","blueprint"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test release graph, integrity, registry and upload boundaries
        run: python3 -m unittest discover -s scripts -p test_rust_release.py -v
      # rdkafka-sys (blueprint Kafka worker) builds librdkafka, which needs libcurl headers.
      - name: Install native build dependencies
        if: matrix.scope == 'blueprint'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libsasl2-dev
      - name: Build each ${{ matrix.scope }} crate with default features and each feature alone
        run: python3 scripts/rust_feature_matrix.py ${{ matrix.scope == 'blueprint' && 'blueprint-rs' || 'framework-rs' }} --target-dir "$RUNNER_TEMP/feature-matrix-target"
      - name: Package ${{ matrix.scope }} crates
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_RELEASE_TAG: ${{ inputs.reuse_verified_release_tag || '' }}
        run: |
          reuse=()
          if [ -n "$PRIOR_RELEASE_TAG" ]; then
            python3 scripts/rust_release.py hydrate --repository "$GITHUB_REPOSITORY" --tag "$PRIOR_RELEASE_TAG" --output "$RUNNER_TEMP/prior-rust-release"
            reuse=(--reuse-verified-release "$RUNNER_TEMP/prior-rust-release")
          fi
          # Release runs keep crates.io archives for versions already published.
          # Pull requests skip that: main normally has unreleased changes at its version.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            reuse+=(--reuse-published)
          fi
          python3 scripts/rust_release.py prepare --scope "${{ matrix.scope }}" --output "$RUNNER_TEMP/rust-release" "${reuse[@]}"
      - name: Install staged registry crates and verify (framework also starts HTTP/MCP)
        run: |
          framework=()
          # A version PR moves the framework too, and it is not on crates.io until
          # the merge. Serve it from this checkout, beside the blueprint.
          if [ "${{ matrix.scope }}" = blueprint ] && [ "$GITHUB_EVENT_NAME" = pull_request ] && ! python3 scripts/rust_release.py check-published --scope framework; then
            python3 scripts/rust_release.py prepare --scope framework --output "$RUNNER_TEMP/rust-release-framework"
            framework=(--framework-release "$RUNNER_TEMP/rust-release-framework")
          fi
          python3 scripts/rust_release.py verify --output "$RUNNER_TEMP/rust-release" --target-dir "$RUNNER_TEMP/rust-release-target" "${framework[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: rust-crate-release-${{ matrix.scope }}-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/rust-release/release.json
            ${{ runner.temp }}/rust-release/verification.json
            ${{ runner.temp }}/rust-release/cargo-target/package/*.crate
            ${{ runner.temp }}/rust-release/fresh-packages/*.crate

  publish:
    # From main (tag created here) or from the scope's existing tag; never from a fork.
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.stage == 'release' && inputs.publish &&
      !github.event.repository.fork &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/rust-'))
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: rust-crate-release-${{ inputs.scope }}-${{ github.sha }}
          path: ${{ runner.temp }}/rust-release
      - name: Tag and GitHub release for the verified commit
        env:
          GH_TOKEN: ${{ github.token }}
          SCOPE: ${{ inputs.scope }}
        run: |
          version=$(python3 -c "import sys; sys.path.insert(0, 'scripts'); import rust_release as r; print(r.scope_version('$SCOPE'))")
          tag=$([ "$SCOPE" = blueprint ] && echo "rust-blueprint-v$version" || echo "rust-v$version")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "$tag" || { echo "::error::dispatched from $GITHUB_REF_NAME but $SCOPE is at $version ($tag)"; exit 1; }
          elif existing=$(git rev-parse --verify --quiet "refs/tags/$tag^{commit}"); then
            test "$existing" = "$GITHUB_SHA" || { echo "::error::$tag already exists on $existing, not this commit $GITHUB_SHA"; exit 1; }
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          git checkout --quiet "refs/tags/$tag"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            title=$([ "$SCOPE" = blueprint ] && echo "Rust blueprint $version" || echo "Rust framework $version")
            gh release create "$tag" --verify-tag --title "$title" --generate-notes --latest=false
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Validate exact tagged checkout and verification receipt
        run: python3 scripts/rust_release.py publish --output "$RUNNER_TEMP/rust-release" --tag "$RELEASE_TAG"
      - name: Preserve exact verified archives and comparison evidence on public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
          evidence=()
          if [ -d "$RUNNER_TEMP/rust-release/fresh-packages" ]; then
            tar -C "$RUNNER_TEMP/rust-release" -czf "$RUNNER_TEMP/rust-release/fresh-package-comparisons.tar.gz" fresh-packages
            evidence=("$RUNNER_TEMP/rust-release/fresh-package-comparisons.tar.gz")
          fi
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/rust-release/release.json" "$RUNNER_TEMP/rust-release/verification.json" "$RUNNER_TEMP/rust-release/cargo-target/package/"*.crate "${evidence[@]}" --clobber
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
        run: python3 scripts/rust_release.py publish --scope "${{ inputs.scope }}" --output "$RUNNER_TEMP/rust-release" --tag "$RELEASE_TAG" --upload
      - name: Preserve complete publication receipt for future verified reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/rust-release/publication.json" --clobber
      - name: Preserve publication receipt, including partial releases
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-${{ inputs.scope }}-publication-${{ github.sha }}
          if-no-files-found: ignore
          path: ${{ runner.temp }}/rust-release/publication.json
      - name: Start the blueprint now the framework is on crates.io
        if: inputs.scope == 'framework' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run rust_release.yml --ref main -f stage=release -f scope=blueprint -f publish=true

  cli-pickup:
    # The crates are out, so the CLI can depend on them and generate them.
    if: inputs.scope == 'blueprint' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Every crate is on crates.io
        run: python3 scripts/rust_release.py check-published --scope all
      - name: Move the CLI to the published crates
        run: |
          python3 scripts/rust_release.py pin-cli
          cargo metadata --format-version 1 --manifest-path cli/Cargo.toml > /dev/null
          (cd .github/workflows/scripts/check_blueprint_deps && cargo run --quiet -- --fix --rust-released)
      - name: Push the branch and open the PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
        run: |
          if git diff --quiet; then
            echo "The CLI already uses these crates"
            exit 0
          fi
          version=$(python3 -c "import sys; sys.path.insert(0, 'scripts'); import rust_release as r; print(r.scope_version('framework'))")
          branch="release/cli-rust-$version"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add -A
          git commit -m "chore(release): CLI uses Rust crates $version"
          git push origin "$branch"
          if ! gh pr create --base main --head "$branch" --title "chore(release): CLI uses Rust crates $version" --body "Moves the CLI and the Cargo versions it generates to the published Rust $version crates. Generated by $GITHUB_WORKFLOW run $GITHUB_RUN_ID. Merge it before releasing the CLI."; then
            echo "::warning::Actions may not open pull requests here. Open it from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch"
          fi
