name: CLI Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cli/**"
      - "framework-rs/**"
      - "blueprint-rs/**"
      - "scripts/sync_rust_embedded_sources.py"
      - "scripts/test_sync_rust_embedded_sources.py"
      - ".github/workflows/cli_tests.yml"
      - ".github/actions/rust-build-cache/**"
  pull_request:
    paths:
      - "cli/**"
      - "framework-rs/**"
      - "blueprint-rs/**"
      - "scripts/sync_rust_embedded_sources.py"
      - "scripts/test_sync_rust_embedded_sources.py"
      - ".github/workflows/cli_tests.yml"
      - ".github/actions/rust-build-cache/**"

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The pack `forklaunch context` writes into a user's project is vendored
      # here and embedded into the binary. Two ways it silently rots, both of
      # which have already happened:
      #
      #   - the README index and the shipped skills disagree, so an agent is
      #     told to invoke something that is not there -- or, worse, never told
      #     a skill exists at all;
      #   - the allowlist in cli/assets/skills.toml and the vendored directory
      #     disagree, so the next `sync-skills.bash` silently DELETES skills
      #     that currently ship.
      #
      # Both checks are offline and take milliseconds. Neither was wired up,
      # which is why nine skills and SETUP.md sat outside the allowlist.
      - name: Skill pack is self-consistent
        run: |
          bash cli/scripts/check-skill-index.sh
          bash cli/scripts/check-skill-allowlist.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Embedded source ownership and Git metadata safety
        run: python3 -m unittest discover -s scripts -p test_sync_rust_embedded_sources.py -v

      # Replaces an actions/cache entry that cached `target` (cargo builds into
      # cli/target) under a key hashing cli/Cargo.lock, which is gitignored.
      - name: Rust build cache
        uses: ./.github/actions/rust-build-cache
        with:
          family: tests-cli

      - name: Run CLI tests
        working-directory: ./cli
        run: cargo test --verbose

      - name: Save compiler cache
        if: always()
        uses: ./.github/actions/rust-build-cache/save
