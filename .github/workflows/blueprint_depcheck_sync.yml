# Runs `check_blueprint_deps --fix` and opens a PR with whatever it changed.
#
# `package_json_constants.rs` records the version of every @forklaunch package
# the CLI scaffolds into a generated app. Those constants are edited by hand and
# have to match the blueprint package.json files, so they drift every time the
# packages are released -- and the drift is invisible until a scaffold pins a
# version that no longer exists, or pins an OLD one beside a new sibling and the
# generated app installs two copies of a package it cannot have two of.
#
# `check_blueprint_deps` already knows how to repair this; `--fix` rewrites the
# constants file. This workflow exists so nobody has to remember that, and so
# the repair arrives as a reviewable diff rather than something a release
# forgets to do.
#
# Deliberately opens a PR rather than pushing to main: the constants govern what
# every new app installs, so the change is small but not one to land unseen.
name: Blueprint Dependency Sync

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  # After a release lands, the constants are the thing most likely to be stale.
  push:
    branches:
      - main
    paths:
      - 'blueprint/**/package.json'
      - 'framework/**/package.json'

concurrency:
  # One sync at a time; a second push must not race a branch update.
  group: blueprint-depcheck-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run check_blueprint_deps --fix
        run: |
          # Reads only package.json files, so no pnpm install is needed.
          # Must run from its own directory: its paths are ../../../../blueprint.
          cd .github/workflows/scripts/check_blueprint_deps
          cargo run --bin check_blueprint_deps -- --fix

      - name: Open a PR if anything changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # The fixer writes exactly one file. Scope every git operation to it,
          # so a stray build artifact can never ride along into the commit.
          CONSTANTS="cli/src/core/package_json/package_json_constants.rs"

          if git diff --quiet -- "$CONSTANTS"; then
            echo "Constants already match the blueprint packages; nothing to sync."
            exit 0
          fi

          echo "Drift found:"
          git --no-pager diff --stat -- "$CONSTANTS"

          BRANCH="chore/blueprint-depcheck-sync"

          cat > /tmp/commit-msg.txt <<'MSG'
          chore(cli): sync package_json_constants with blueprint packages

          Generated by `check_blueprint_deps --fix`.

          These constants are the versions the CLI writes into a newly scaffolded
          app. When they lag the blueprint packages, a generated app pins an old
          version beside a released one, which is how a tree ends up with two
          copies of a package whose classes carry a `#private` brand -- and every
          generated app stops typechecking.
          MSG

          cat > /tmp/pr-body.md <<'BODY'
          `check_blueprint_deps --fix` found the CLI's pinned `@forklaunch`
          versions out of step with the blueprint packages.

          These constants decide what a **newly scaffolded app installs**. When
          they lag a release, a generated app pins an old version of one package
          beside a new version of its sibling. For packages whose classes carry a
          `#private` field -- MikroORM's `EntityManager` and `EntitySchema`, and
          much of the `@forklaunch` surface -- TypeScript treats that field as a
          per-class brand, so two copies are structurally incompatible and every
          generated app stops compiling with `TS2741` / `TS2883` / `TS2345`.

          Opened automatically. Review the diff and merge if it looks right.
          BODY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "$CONSTANTS"
          git commit -F /tmp/commit-msg.txt

          # Force-push: this branch is a rolling snapshot of current drift, not a
          # history worth preserving.
          git push --force origin "$BRANCH"

          if [ "$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null || true)" = "OPEN" ]; then
            echo "PR already open for $BRANCH; updated it in place."
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(cli): sync package_json_constants with blueprint packages" \
            --body-file /tmp/pr-body.md
