name: Blueprint Dependency Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'blueprint/**/package.json'
      - 'cli/src/core/package_json/package_json_constants.rs'
      - 'framework-rs/**/Cargo.toml'
      - 'blueprint-rs/**/Cargo.toml'
      - 'cli/src/core/cargo_toml/cargo_toml_constants.rs'
      - '.github/workflows/scripts/check_blueprint_deps/**'
      - '.github/actions/rust-build-cache/**'
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  # Which suites this pull request can affect (.github/ci/impact.py). Pushes
  # and dispatches run everything.
  changes:
    name: Changed paths
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      full: ${{ github.event_name != 'pull_request' }}

  depcheck:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.impacts), 'depcheck')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Rust build cache
        uses: ./.github/actions/rust-build-cache
        with:
          family: cli

      - name: Build CLI
        run: |
          cd cli
          cargo build --release
          chmod +x ./target/release/forklaunch

      - name: Run CLI in blueprint
        run: |
          cd blueprint
          ../cli/target/release/forklaunch depcheck

      - name: Run blueprint dependency version check
        run: |
          cd .github/workflows/scripts/check_blueprint_deps
          if ! cargo run --bin check_blueprint_deps; then
            echo
            echo "::error::package_json_constants.rs or cargo_toml_constants.rs has drifted from the blueprint and framework workspaces."
            echo "Fix it by running, from the repository root:"
            echo "  cd .github/workflows/scripts/check_blueprint_deps && cargo run --bin check_blueprint_deps -- --fix"
            echo "or trigger the 'Blueprint Dependency Sync' workflow, which opens a PR with the same change."
            exit 1
          fi
