name: Blueprint Dependency Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'blueprint/**/package.json'
      - 'cli/src/core/package_json/package_json_constants.rs'
  pull_request:
    paths:
      - 'blueprint/**/package.json'
      - 'cli/src/core/package_json/package_json_constants.rs'

jobs:
  depcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: |
          cd cli
          cargo build --release
          chmod +x ./target/release/forklaunch

      - name: Run CLI in blueprint
        run: |
          cd blueprint
          ../cli/target/release/forklaunch depcheck

      - name: Run blueprint dependency version check
        run: |
          cd .github/workflows/scripts/check_blueprint_deps
          if ! cargo run --bin check_blueprint_deps; then
            echo
            echo "::error::package_json_constants.rs has drifted from the blueprint package.json files."
            echo "Fix it by running, from the repository root:"
            echo "  cd .github/workflows/scripts/check_blueprint_deps && cargo run --bin check_blueprint_deps -- --fix"
            echo "or trigger the 'Blueprint Dependency Sync' workflow, which opens a PR with the same change."
            exit 1
          fi
