name: CAC Tests

# The cac module's unit tests and its end-to-end suite (real Postgres and
# Redis through testcontainers, which use the runner's Docker). Unit tests
# run first so a logic failure shows before the slower e2e suite starts.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'blueprint/cac-base/**'
      - 'blueprint/implementations/cac/**'
      - 'blueprint/interfaces/cac/**'
      - '.github/workflows/cac_tests.yml'
  pull_request:
    paths:
      - 'blueprint/cac-base/**'
      - 'blueprint/implementations/cac/**'
      - 'blueprint/interfaces/cac/**'
      - '.github/workflows/cac_tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.0

      - name: Install dependencies
        working-directory: ./blueprint
        run: pnpm install --frozen-lockfile

      - name: Build cac packages
        working-directory: ./blueprint
        run: pnpm --filter '@forklaunch/blueprint-cac-base...' run build

      - name: Unit tests (implementation-cac-base)
        working-directory: ./blueprint/implementations/cac/base
        run: pnpm exec vitest run

      - name: Unit tests (cac-base)
        working-directory: ./blueprint/cac-base
        run: pnpm exec vitest run --exclude '__test__/e2e/**'

      - name: End-to-end tests (cac-base)
        working-directory: ./blueprint/cac-base
        run: pnpm exec vitest run __test__/e2e
