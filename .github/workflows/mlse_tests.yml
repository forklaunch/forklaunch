name: MLSE Tests

# The mlse packages' unit tests: the safety classifier and its evaluation set,
# label matching, the support checks, fetchers against recorded responses and
# the Claude provider through the real SDK. The mlse-base module adds its
# service suite (Postgres with pgvector) to this workflow.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'blueprint/implementations/mlse/**'
      - 'blueprint/interfaces/mlse/**'
      - '.github/workflows/mlse_tests.yml'
  pull_request:
    paths:
      - 'blueprint/implementations/mlse/**'
      - 'blueprint/interfaces/mlse/**'
      - '.github/workflows/mlse_tests.yml'

# the tests only read the repository
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
        with:
          version: 11.28.7

      - name: Install dependencies
        working-directory: ./blueprint
        run: pnpm install --frozen-lockfile

      - name: Build mlse packages
        working-directory: ./blueprint
        run: pnpm --filter '@forklaunch/implementation-mlse-base...' run build

      - name: Unit tests (implementation-mlse-base)
        working-directory: ./blueprint/implementations/mlse/base
        run: pnpm exec vitest run
