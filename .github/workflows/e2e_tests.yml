name: E2E Tests

# Runs on every pull request so the aggregate "E2E Tests" check always reports;
# the `changes` job decides which suites a pull request actually needs. Pushes
# to main, the nightly schedule and a dispatch with `full` run everything.
on:
  workflow_dispatch:
    inputs:
      full:
        description: 'Run every suite regardless of which paths changed'
        type: boolean
        default: false
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '23 6 * * *'

# actions: read lets the compiler-cache steps find and download earlier
# runs' store artifacts.
permissions:
  contents: read
  actions: read

# A newer push to the same pull request supersedes the run in flight.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One place that decides which suites a pull request needs. Every other job
  # gates on its outputs; the aggregate `E2E Tests` job at the end turns the
  # skipped ones into a single passing (or failing) status.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.mode.outputs.full == 'true' || steps.filter.outputs.rust == 'true' }}
      typescript: ${{ steps.mode.outputs.full == 'true' || steps.filter.outputs.typescript == 'true' }}
      full: ${{ steps.mode.outputs.full }}
      typescript-matrix: ${{ steps.suites.outputs.typescript }}
      rust-matrix: ${{ steps.suites.outputs.rust }}
      native-matrix: ${{ steps.suites.outputs.native }}
    steps:
      - name: Decide between a full and a filtered run
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          FULL: ${{ inputs.full || false }}
          ON_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          if [ "$EVENT" = push ] || [ "$EVENT" = schedule ] || [ "$FULL" = true ] || [ "$ON_DEFAULT_BRANCH" = true ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi
      # Pull requests list their files through the API and need only the
      # suite layout; a filtered dispatch compares the branch with the
      # default branch and needs the history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ (steps.mode.outputs.full != 'true' && github.event_name != 'pull_request') && '0' || '1' }}
          sparse-checkout: .github/ci
      # Fast-tier suites on pull requests; every suite on a full run.
      - name: Select suites for this tier
        id: suites
        env:
          FULL: ${{ steps.mode.outputs.full }}
        run: |
          python3 - <<'PY'
          import json, os, re
          layout = json.load(open('.github/ci/e2e-suites.json'))
          full = os.environ['FULL'] == 'true'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for kind in ('typescript', 'rust', 'native'):
                  chosen = [{k: v for k, v in entry.items() if k != 'tier'}
                            for entry in layout[kind] if full or entry['tier'] == 'fast']
                  # Each Rust job keeps its own compiler store.
                  for entry in chosen:
                      label = entry.get('name') or entry.get('suite')
                      entry.setdefault('family', 'e2e-' + re.sub(r'[^a-z0-9]+', '-', label.lower()).strip('-'))
                  print(f'{kind}: {[e.get("name", e.get("suite")) for e in chosen]}')
                  out.write(f'{kind}={json.dumps(chosen)}\n')
          PY
      - id: filter
        if: steps.mode.outputs.full != 'true'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.event_name == 'pull_request' && '' || github.event.repository.default_branch }}
          filters: |
            rust:
              - 'cli/**'
              - 'framework-rs/**'
              - 'blueprint-rs/**'
              - 'blueprint/client-sdk/**'
              - 'blueprint/iam-better-auth/**'
              - 'framework/core/src/persistence/**'
              - 'framework/universal-sdk/**'
              - 'scripts/rust_*'
              - '.github/workflows/e2e_tests.yml'
              - '.github/actions/rust-build-cache/**'
            typescript:
              - 'cli/**'
              - 'framework/**'
              - 'blueprint/**'
              - '.github/workflows/e2e_tests.yml'

  # The CLI is compiled once and shared. Previously all six test jobs ran
  # `cargo build --release` themselves — around four minutes each, roughly
  # twenty-five minutes of duplicated compute per run — and every one of the
  # 207 `cargo run --release` calls inside the scripts re-checked that build.
  #
  # Compiled output comes from the shared sccache store (see
  # .github/actions/rust-build-cache), which every Rust job in this and the
  # other workflows reads and writes, so the target directory is no longer
  # cached per job.
  build-cli:
    name: Build CLI
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: ./.github/actions/rust-build-cache
        with:
          family: cli

      - name: Build CLI
        working-directory: ./cli
        # Not --locked: cli/Cargo.lock is gitignored, so there is no committed
        # lock file to honour. That is also why the previous cache key,
        # hashFiles('**/Cargo.lock'), hashed nothing.
        run: cargo build --release

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: forklaunch-cli
          path: cli/target/release/forklaunch
          retention-days: 1
          if-no-files-found: error

      - name: Save compiler cache
        if: always()
        uses: ./.github/actions/rust-build-cache/save

  # The packaged-install check used to run inside Build CLI, after the build,
  # so every suite waited on it as well. It now runs beside Build CLI and,
  # because it scaffolds and compiles a generated Rust service, worker and
  # library, doubles as the pre-warm for the Rust suites: they start only once
  # it has written that dependency graph into the compiler cache, instead of
  # all compiling it cold at the same moment.
  verify-packaged-cli:
    name: Verify packaged CLI
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: ./.github/actions/rust-build-cache
        with:
          family: generated
          fallback-family: cli
          size: 2G

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify packaged CLI installation and Rust generation
        run: bash cli/tests/rust_packaged_install.sh

      - name: Compiler cache statistics
        if: always()
        run: '"$SCCACHE_PATH" --show-stats'

  # Canonical applications scaffolded with this CLI and built once
  # (cli/tests/README.md, "Golden apps"). The Rust bundle carries the shared
  # pre-built Cargo target, which is the real saving: a suite's copied or
  # fresh scaffold then rebuilds only its own crates. Shipped as artifacts,
  # which do not count against the repository's 10 GB Actions cache.
  golden-apps:
    name: Golden apps
    needs: [changes, build-cli]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: '2'
      # Must match every consumer: it is part of each Cargo fingerprint.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      FORKLAUNCH_CLI: ${{ github.workspace }}/cli-bin/forklaunch
    steps:
      - uses: actions/checkout@v7
      # The runner context is not available in job-level env.
      - name: Golden apps location
        run: echo "FORKLAUNCH_GOLDEN_APPS_DIR=$RUNNER_TEMP/golden-apps" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust build cache
        uses: ./.github/actions/rust-build-cache
        with:
          family: generated
          fallback-family: cli
          size: 2G
      - name: Install native build dependencies for generated workers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libsasl2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
      - name: Configure pnpm store
        run: |
          mkdir -p ~/.pnpm-store
          pnpm config set store-dir ~/.pnpm-store --global
      - name: Restore pnpm store
        uses: actions/cache/restore@v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('cli/src/core/package_json/package_json_constants.rs') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: actions/download-artifact@v4
        with:
          name: forklaunch-cli
          path: cli-bin
      - run: chmod +x "$FORKLAUNCH_CLI"
      - name: Mock platform token
        run: |
          mkdir -p ~/.forklaunch
          cat > ~/.forklaunch/token << 'EOF'
          access_token = "mock_access_token_for_e2e_tests"
          refresh_token = "mock_refresh_token_for_e2e_tests"
          expires_at = 9999999999
          EOF
      - name: Build golden apps
        env:
          NPM_CONFIG_PREFER_OFFLINE: "true"
        run: bash cli/tests/golden_apps.sh build
      - name: Package golden apps
        run: |
          bash cli/tests/golden_apps.sh package --out "$RUNNER_TEMP/golden-out" ts rust
          ls -la "$RUNNER_TEMP/golden-out"
      # Already zstd-compressed: no second compression pass.
      - uses: actions/upload-artifact@v4
        with:
          name: golden-apps-ts
          path: ${{ runner.temp }}/golden-out/golden-apps-ts.tar.*
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: golden-apps-rust
          path: ${{ runner.temp }}/golden-out/golden-apps-rust.tar.*
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Save compiler cache
        if: always()
        uses: ./.github/actions/rust-build-cache/save

  test:
    needs: [changes, build-cli, golden-apps]
    if: ${{ !cancelled() && needs.build-cli.result == 'success' && needs.golden-apps.result == 'success' && needs.changes.outputs.typescript == 'true' }}
    runs-on: ubuntu-latest
    env:
      # Recorded with the golden apps; matching it keeps golden.py quiet.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.typescript-matrix) }}

    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v7
      - name: Golden apps location
        run: |
          echo "FORKLAUNCH_GOLDEN_APPS_DIR=$RUNNER_TEMP/golden-apps" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/golden-apps/target" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Must equal BUN_VERSION in cli/src/constants.rs (the generated images'
      # oven/bun tag); a unit test in cli/src/core/github_configs.rs enforces it.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      # The scaffolded applications install the same dependency trees over and
      # over. Nothing cached them before, so every install refetched everything
      # from the registry — the single largest cost in these jobs.
      # Pinned rather than read back from `pnpm store path`, which reported a
      # directory that pnpm had not created yet — the save step then refused it
      # with "Path(s) specified in the action for caching do(es) not exist".
      # Creating it up front also guarantees every generated application shares
      # one store instead of each resolving its own.
      - name: Configure pnpm store
        run: |
          mkdir -p ~/.pnpm-store
          pnpm config set store-dir ~/.pnpm-store --global

      # Split restore/save rather than plain actions/cache, which skips its
      # post-save step whenever the job fails. That is the wrong way round
      # here: a red run still populates the store, and it is precisely while
      # CI is failing that the next attempt most wants a warm cache.
      - name: Restore pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('cli/src/core/package_json/package_json_constants.rs') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Download CLI binary
        uses: actions/download-artifact@v4
        with:
          name: forklaunch-cli
          path: cli-bin
      - name: Download TypeScript golden apps
        if: contains(matrix.bundles, 'ts')
        uses: actions/download-artifact@v4
        with:
          name: golden-apps-ts
          path: ${{ runner.temp }}/golden-dl
      - name: Download Rust golden apps
        if: contains(matrix.bundles, 'rust')
        uses: actions/download-artifact@v4
        with:
          name: golden-apps-rust
          path: ${{ runner.temp }}/golden-dl
      - name: Unpack golden apps
        if: matrix.bundles != ''
        run: bash cli/tests/golden_apps.sh unpack "$RUNNER_TEMP"/golden-dl/golden-apps-*.tar.*

      - name: Create .forklaunch directory
        run: mkdir -p ~/.forklaunch

      - name: Create token file
        run: |
          cat > ~/.forklaunch/token << 'EOF'
          access_token = "mock_access_token_for_e2e_tests"
          refresh_token = "mock_refresh_token_for_e2e_tests"
          expires_at = 9999999999
          EOF

      - name: Run ${{ matrix.name }}
        working-directory: ./cli/tests
        env:
          # Scripts fall back to `cargo run --release` when this is unset, so
          # they still work unchanged for anyone running them locally.
          FORKLAUNCH_CLI: ${{ github.workspace }}/cli-bin/forklaunch
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
          FORKLAUNCH_TEST_VALIDATOR_DEPENDENCIES: ${{ runner.temp }}/fl-rust-ts
          FORKLAUNCH_TEST_WS_SDK_DEPENDENCIES: ${{ runner.temp }}/fl-rust-ts
          ASYNCAPI_PARSER_PATH: ${{ runner.temp }}/fl-rust-ts/node_modules/@asyncapi/parser
          # With a warm store there is no reason to go to the network first.
          NPM_CONFIG_PREFER_OFFLINE: "true"
          SHARDS: ${{ matrix.shards }}
        run: |
          set -e
          chmod +x "$FORKLAUNCH_CLI"
          if [ -n "$SHARDS" ]; then
            # shards.sh runs every script, prints timings, fails if any failed.
            # shellcheck disable=SC2086
            exec bash shards.sh run $SHARDS
          fi
          test_count=0
          failed=()
          # Every script runs even after one fails, so a job that holds
          # several suites reports all of them.
          for test_script in ${{ matrix.scripts }}; do
            if [ -f "$test_script" ]; then
              echo "[INFO] Running test: $test_script"
              test_count=$((test_count + 1))
              if ! bash "$test_script"; then
                echo "[ERROR] Test failed: $test_script"
                failed+=("$test_script")
                continue
              fi
              echo "[OK] Test passed: $test_script"
            else
              echo "[ERROR] Missing test script: $test_script"
              failed+=("$test_script")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "[ERROR] ${#failed[@]} of $test_count failed in group ${{ matrix.name }}: ${failed[*]}"
            exit 1
          fi
          echo "[SUCCESS] All $test_count tests passed in group: ${{ matrix.name }}"

      # A content-addressed store, so saving a partially populated one is safe:
      # entries are immutable and keyed by hash, and the next run reuses
      # whatever made it in.
      - name: Save pnpm store
        if: always() && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('cli/src/core/package_json/package_json_constants.rs') }}

  test-rust:
    needs: [changes, build-cli, golden-apps]
    if: ${{ !cancelled() && needs.build-cli.result == 'success' && needs.golden-apps.result == 'success' && needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    env:
      # Must match the golden-apps job: it is part of each Cargo fingerprint.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # Loads .github/actions/rust-build-cache/stable-tmp/preload.cjs once the
      # cache step has set FORKLAUNCH_STABLE_TMP_PRELOAD; a no-op before that.
      # Set here because GitHub refuses NODE_OPTIONS through GITHUB_ENV.
      NODE_OPTIONS: --import=data:text/javascript,if(process.env.FORKLAUNCH_STABLE_TMP_PRELOAD){(await(import(%22node:module%22))).createRequire(process.env.FORKLAUNCH_STABLE_TMP_PRELOAD)(process.env.FORKLAUNCH_STABLE_TMP_PRELOAD)}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.rust-matrix) }}

    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust for generated backend checks
        uses: dtolnay/rust-toolchain@stable

      # Its own store, else the golden-apps job's; stable temporary paths so
      # the scaffolds it compiles match next time.
      - name: Rust build cache
        uses: ./.github/actions/rust-build-cache
        with:
          family: ${{ matrix.family }}
          fallback-family: generated
          stable-tmp: 'true'
          size: 2G

      # rdkafka-sys (generated Kafka workers) builds librdkafka, which needs libcurl headers.
      - name: Install native build dependencies for generated workers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libsasl2-dev

      # The golden Rust bundle carries the shared Cargo target.
      - name: Golden apps location
        run: |
          echo "FORKLAUNCH_GOLDEN_APPS_DIR=$RUNNER_TEMP/golden-apps" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/golden-apps/target" >> "$GITHUB_ENV"

      - name: Install TypeScript compiler for SDK checks
        run: npm install --before="$(date -u -d '2 days ago' +%Y-%m-%dT%H:%M:%SZ)" --prefix "$RUNNER_TEMP/fl-rust-ts" --no-save --package-lock=false --ignore-scripts typescript@5.9.3 qs@6.16.0 @types/qs@6.15.1 @types/node@22 @types/ws@8.18.1 ws@8.22.0 ajv@8.20.0 ajv-draft-04@1.0.0 ajv-formats@3.0.1 @asyncapi/parser@3.6.3 stripe@22.6.2 bullmq@6.3.10 ioredis@6.0.0 zod@4.6.5 ts-deepmerge@8.0.0 cross-fetch@4.1.0 better-auth@1.7.6 esbuild@0.28.2

      - name: Configure pinned worker and auth client fixtures
        run: |
          echo "BULLMQ_SDK_PATH=$RUNNER_TEMP/fl-rust-ts/node_modules/bullmq" >> "$GITHUB_ENV"
          echo "FORKLAUNCH_TEST_BETTER_AUTH_DEPENDENCIES=$RUNNER_TEMP/fl-rust-ts" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Must equal BUN_VERSION in cli/src/constants.rs (the generated images'
      # oven/bun tag); a unit test in cli/src/core/github_configs.rs enforces it.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      # The scaffolded applications install the same dependency trees over and
      # over. Nothing cached them before, so every install refetched everything
      # from the registry — the single largest cost in these jobs.
      # Pinned rather than read back from `pnpm store path`, which reported a
      # directory that pnpm had not created yet — the save step then refused it
      # with "Path(s) specified in the action for caching do(es) not exist".
      # Creating it up front also guarantees every generated application shares
      # one store instead of each resolving its own.
      - name: Configure pnpm store
        run: |
          mkdir -p ~/.pnpm-store
          pnpm config set store-dir ~/.pnpm-store --global

      # Split restore/save rather than plain actions/cache, which skips its
      # post-save step whenever the job fails. That is the wrong way round
      # here: a red run still populates the store, and it is precisely while
      # CI is failing that the next attempt most wants a warm cache.
      - name: Restore pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('cli/src/core/package_json/package_json_constants.rs') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Download CLI binary
        uses: actions/download-artifact@v4
        with:
          name: forklaunch-cli
          path: cli-bin
      - name: Download TypeScript golden apps
        if: contains(matrix.bundles, 'ts')
        uses: actions/download-artifact@v4
        with:
          name: golden-apps-ts
          path: ${{ runner.temp }}/golden-dl
      - name: Download Rust golden apps
        if: contains(matrix.bundles, 'rust')
        uses: actions/download-artifact@v4
        with:
          name: golden-apps-rust
          path: ${{ runner.temp }}/golden-dl
      - name: Unpack golden apps
        if: matrix.bundles != ''
        run: bash cli/tests/golden_apps.sh unpack "$RUNNER_TEMP"/golden-dl/golden-apps-*.tar.*
      # The shards hold the former Rust native suites, which ran with it.
      - name: Skip formatting in shard suites
        if: matrix.shards != ''
        run: echo "FORKLAUNCH_SKIP_FORMAT=1" >> "$GITHUB_ENV"

      - name: Create .forklaunch directory
        run: mkdir -p ~/.forklaunch

      - name: Create token file
        run: |
          cat > ~/.forklaunch/token << 'EOF'
          access_token = "mock_access_token_for_e2e_tests"
          refresh_token = "mock_refresh_token_for_e2e_tests"
          expires_at = 9999999999
          EOF

      - name: Run ${{ matrix.name }}
        working-directory: ./cli/tests
        env:
          # Scripts fall back to `cargo run --release` when this is unset, so
          # they still work unchanged for anyone running them locally.
          FORKLAUNCH_CLI: ${{ github.workspace }}/cli-bin/forklaunch
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
          FORKLAUNCH_TEST_VALIDATOR_DEPENDENCIES: ${{ runner.temp }}/fl-rust-ts
          FORKLAUNCH_TEST_WS_SDK_DEPENDENCIES: ${{ runner.temp }}/fl-rust-ts
          ASYNCAPI_PARSER_PATH: ${{ runner.temp }}/fl-rust-ts/node_modules/@asyncapi/parser
          # With a warm store there is no reason to go to the network first.
          NPM_CONFIG_PREFER_OFFLINE: "true"
          SHARDS: ${{ matrix.shards }}
        run: |
          set -e
          chmod +x "$FORKLAUNCH_CLI"
          if [ -n "$SHARDS" ]; then
            # shards.sh runs every script, prints timings, fails if any failed.
            # shellcheck disable=SC2086
            exec bash shards.sh run $SHARDS
          fi
          test_count=0
          failed=()
          # Every script runs even after one fails, so a job that holds
          # several suites reports all of them.
          for test_script in ${{ matrix.scripts }}; do
            if [ -f "$test_script" ]; then
              echo "[INFO] Running test: $test_script"
              test_count=$((test_count + 1))
              if ! bash "$test_script"; then
                echo "[ERROR] Test failed: $test_script"
                failed+=("$test_script")
                continue
              fi
              echo "[OK] Test passed: $test_script"
            else
              echo "[ERROR] Missing test script: $test_script"
              failed+=("$test_script")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "[ERROR] ${#failed[@]} of $test_count failed in group ${{ matrix.name }}: ${failed[*]}"
            exit 1
          fi
          echo "[SUCCESS] All $test_count tests passed in group: ${{ matrix.name }}"

      # A content-addressed store, so saving a partially populated one is safe:
      # entries are immutable and keyed by hash, and the next run reuses
      # whatever made it in.
      - name: Save pnpm store
        if: always() && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('cli/src/core/package_json/package_json_constants.rs') }}

      - name: Save compiler cache
        if: always()
        uses: ./.github/actions/rust-build-cache/save

  rust-native-lifecycle:
    name: Rust native ${{ matrix.suite }}
    needs: [changes, build-cli, golden-apps]
    if: ${{ !cancelled() && needs.build-cli.result == 'success' && needs.golden-apps.result == 'success' && needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Suites that take a few minutes share a job (space-separated), so
        # fewer jobs wait for a runner and repeat the setup; every suite in a
        # job runs even when an earlier one fails. Layout and tiers:
        # .github/ci/e2e-suites.json.
        include: ${{ fromJSON(needs.changes.outputs.native-matrix) }}
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      FORKLAUNCH_CLI: ${{ github.workspace }}/cli-bin/forklaunch
      FORKLAUNCH_SKIP_FORMAT: '1'
      # Must match the golden-apps job: it is part of each Cargo fingerprint.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # Loads .github/actions/rust-build-cache/stable-tmp/preload.cjs once the
      # cache step has set FORKLAUNCH_STABLE_TMP_PRELOAD; a no-op before that.
      # Set here because GitHub refuses NODE_OPTIONS through GITHUB_ENV.
      NODE_OPTIONS: --import=data:text/javascript,if(process.env.FORKLAUNCH_STABLE_TMP_PRELOAD){(await(import(%22node:module%22))).createRequire(process.env.FORKLAUNCH_STABLE_TMP_PRELOAD)(process.env.FORKLAUNCH_STABLE_TMP_PRELOAD)}
    steps:
      - uses: actions/checkout@v7
      # The runner context is not available in job-level env.
      - name: Golden apps location
        run: |
          echo "FORKLAUNCH_GOLDEN_APPS_DIR=$RUNNER_TEMP/golden-apps" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/golden-apps/target" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust build cache
        uses: ./.github/actions/rust-build-cache
        with:
          family: ${{ matrix.family }}
          fallback-family: generated
          stable-tmp: 'true'
          size: 2G
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      # Must equal BUN_VERSION in cli/src/constants.rs: generated Bun images build
      # with oven/bun:<BUN_VERSION> and run a frozen install of the bun.lock the
      # suite wrote, which another release may not be able to read.
      - uses: oven-sh/setup-bun@v2
        if: contains(matrix.suite, 'sdk-') || startsWith(matrix.suite, 'dev-')
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@v4
        with:
          name: forklaunch-cli
          path: cli-bin
      - uses: actions/download-artifact@v4
        with:
          name: golden-apps-rust
          path: ${{ runner.temp }}/golden-dl
      - run: bash cli/tests/golden_apps.sh unpack "$RUNNER_TEMP"/golden-dl/golden-apps-*.tar.*
      - run: chmod +x "$FORKLAUNCH_CLI"
      - name: Raw scaffolding, generated mappers and HTTP/MCP startup
        if: ${{ !cancelled() && contains(format(' {0} ', matrix.suite), ' scaffolding ') }}
        run: |
          python3 cli/tests/rust_bootstrap_lifecycle.py
          python3 cli/tests/rust_checked_mapper.py
      - name: Raw init, custom module paths, sync discovery, deletion and local SDKs
        if: ${{ !cancelled() && contains(format(' {0} ', matrix.suite), ' projects ') }}
        run: |
          bash cli/tests/rust_init_commands.sh
          bash cli/tests/init_rust_projects.sh
          bash cli/tests/rust_sync_commands.sh
          bash cli/tests/rust_delete_commands.sh
          bash cli/tests/rust_sdk_openapi_commands.sh
          bash cli/tests/rust_package_sources.sh
      - name: Change commands preserve and compile application code
        if: ${{ !cancelled() && contains(format(' {0} ', matrix.suite), ' changes ') }}
        run: |
          bash cli/tests/rust_change_commands.sh
          python3 cli/tests/rust_conversion_preservation.py
      - name: Mixed workspace discovery, package membership and both HTTP/MCP surfaces
        if: ${{ !cancelled() && contains(format(' {0} ', matrix.suite), ' mixed ') }}
        run: |
          bash cli/tests/rust_mixed_sync.sh
          bash cli/tests/rust_typescript_attach.sh
      - name: Service-local SDK workspace repair with real Node and Bun installs and builds
        if: ${{ !cancelled() && contains(format(' {0} ', matrix.suite), ' sdk-http ') }}
        run: bash cli/tests/rust_sdk_workspace.sh
      - name: Current and legacy HTTP SDKs, wire validation and public transport
        if: ${{ !cancelled() && contains(format(' {0} ', matrix.suite), ' http ') }}
        run: bash cli/tests/rust_http_runtime.sh
      - name: Current and legacy SSE SDKs, authentication, cancellation and cleanup
        if: ${{ !cancelled() && contains(format(' {0} ', matrix.suite), ' sse ') }}
        run: bash cli/tests/rust_sse_runtime.sh
      - name: Registry socket compilation and optional schema compiler settings
        if: ${{ !cancelled() && contains(format(' {0} ', matrix.suite), ' socket-compilers ') }}
        run: python3 cli/tests/rust_socket_compiler_sources.py
      - name: Native documentation HTML and pinned framework compatibility
        if: ${{ !cancelled() && contains(format(' {0} ', matrix.suite), ' docs ') }}
        run: python3 cli/tests/rust_native_docs_runtime.py
      - name: WebSocket SDK workspace ownership and real Node and Bun builds
        if: ${{ !cancelled() && contains(format(' {0} ', matrix.suite), ' sdk-socket ') }}
        run: bash cli/tests/rust_socket_workspace.sh
      - name: Combined HTTP and WebSocket SDK workspace ownership
        if: ${{ !cancelled() && contains(format(' {0} ', matrix.suite), ' sdk-combined ') }}
        env:
          FORKLAUNCH_TEST_COMBINED_SDK: '1'
        run: bash cli/tests/rust_socket_workspace.sh
      - name: Mixed Docker development, contract reloads and graceful shutdown
        if: startsWith(matrix.suite, 'dev-')
        env:
          FORKLAUNCH_TEST_DEV_RUNTIME: ${{ matrix.suite == 'dev-bun' && 'bun' || 'node' }}
        run: bash cli/tests/rust_mixed_dev.sh
      - name: Generated telemetry propagation, export and shutdown
        if: ${{ !cancelled() && contains(format(' {0} ', matrix.suite), ' observability ') }}
        run: bash cli/tests/rust_generated_otlp_runtime.sh
      - name: Relocated source-snapshot shared Docker image
        if: ${{ !cancelled() && contains(format(' {0} ', matrix.suite), ' containers ') }}
        run: bash cli/tests/rust_container_runtime.sh
      - name: Infrastructure ownership, dependency modes and actual encrypted stores
        if: ${{ !cancelled() && contains(format(' {0} ', matrix.suite), ' infrastructure ') }}
        run: |
          bash cli/tests/rust_infrastructure_sources.sh
          bash cli/tests/rust_infrastructure_runtime.sh
      - name: PostgreSQL routers, restricted-role tenant isolation and audited protected fields
        if: ${{ !cancelled() && contains(format(' {0} ', matrix.suite), ' postgres-service ') }}
        run: bash cli/tests/rust_postgres_service_runtime.sh
      - name: Generated optimized builds and shared-image release manifests
        if: ${{ !cancelled() && contains(format(' {0} ', matrix.suite), ' release-guard ') }}
        run: bash cli/tests/rust_generated_release_runtime.sh
      - name: Install TypeScript compiler for real signature interoperability
        if: ${{ !cancelled() && contains(format(' {0} ', matrix.suite), ' capabilities ') }}
        run: |
          npm install --before="$(date -u -d '2 days ago' +%Y-%m-%dT%H:%M:%SZ)" --prefix "$RUNNER_TEMP/capabilities-ts" --no-save --package-lock=false --ignore-scripts typescript@5.9.3
          echo "TSC_BIN=$RUNNER_TEMP/capabilities-ts/node_modules/.bin/tsc" >> "$GITHUB_ENV"
      - name: Signed managed callbacks and ownership preservation
        if: ${{ !cancelled() && contains(format(' {0} ', matrix.suite), ' capabilities ') }}
        run: bash cli/tests/rust_capabilities_runtime.sh
      - name: Generate against packaged framework registry dependencies
        if: ${{ !cancelled() && contains(format(' {0} ', matrix.suite), ' registry ') }}
        run: |
          python3 scripts/rust_release.py prepare --scope framework --allow-dirty --output "$RUNNER_TEMP/framework-packages"
          python3 cli/tests/rust_registry_scaffold.py --staging --default-source --release "$RUNNER_TEMP/framework-packages"
      - name: Public framework default, mixed build hooks and Docker HTTP/MCP startup
        if: ${{ !cancelled() && contains(format(' {0} ', matrix.suite), ' published-registry ') }}
        run: |
          python3 scripts/rust_release.py prepare --scope framework --allow-dirty --output "$RUNNER_TEMP/framework-packages"
          python3 cli/tests/rust_registry_scaffold.py --default-source --mixed --docker --release "$RUNNER_TEMP/framework-packages"
      - name: Save compiler cache
        if: always()
        uses: ./.github/actions/rust-build-cache/save

  # The one status to require. It passes when every suite this change needed
  # passed, and when a suite was skipped only because `changes` ruled it out;
  # a suite skipped because something it depends on failed fails it.
  e2e-ok:
    name: E2E Tests
    needs: [changes, build-cli, verify-packaged-cli, golden-apps, test, test-rust, rust-native-lifecycle]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every needed suite passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ['RESULTS'])
          outputs = needs['changes'].get('outputs', {})
          wanted = {
              'changes': True,
              'build-cli': outputs.get('rust') == 'true' or outputs.get('typescript') == 'true',
              'verify-packaged-cli': outputs.get('rust') == 'true',
              'golden-apps': outputs.get('rust') == 'true' or outputs.get('typescript') == 'true',
              'test': outputs.get('typescript') == 'true',
              'test-rust': outputs.get('rust') == 'true',
              'rust-native-lifecycle': outputs.get('rust') == 'true',
          }
          failed = False
          for job, need in needs.items():
              result = need['result']
              required = wanted.get(job, True)
              ok = result == 'success' or (result == 'skipped' and not required)
              print(f"{job}: {result}{'' if required else ' (not needed)'}")
              failed |= not ok
          sys.exit(1 if failed else 0)
          PY
