  blueprint:
    name: blueprint (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [core, billing, modules, timing]
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: parity-test-only
          POSTGRES_DB: parity
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d parity"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FORKLAUNCH_TEST_REDIS_URL: redis://127.0.0.1:6379/
      FORKLAUNCH_TEST_POSTGRES_URL: postgres://postgres:parity-test-only@127.0.0.1:5432/parity
      FORKLAUNCH_TEST_KAFKA_BROKERS: 127.0.0.1:9092
      # Required at startup since 7248a878d; the module HTTP tests exercise /mcp.
      MCP_ENABLED: 'true'
      # Loads .github/actions/rust-build-cache/stable-tmp/preload.cjs once the
      # cache step has set FORKLAUNCH_STABLE_TMP_PRELOAD; a no-op before that.
      # Set here because GitHub refuses NODE_OPTIONS through GITHUB_ENV.
      NODE_OPTIONS: --import=data:text/javascript,if(process.env.FORKLAUNCH_STABLE_TMP_PRELOAD){(await(import(%22node:module%22))).createRequire(process.env.FORKLAUNCH_STABLE_TMP_PRELOAD)(process.env.FORKLAUNCH_STABLE_TMP_PRELOAD)}
    steps:
      - uses: actions/checkout@v7
      # The Kafka worker's rdkafka-sys builds librdkafka with curl and SASL.
      - name: Install native build dependencies for the Kafka worker
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libsasl2-dev
      # The runner context is not available in job-level env.
      - run: |
          # shellcheck disable=SC2129
          echo "TSC_BIN=$RUNNER_TEMP/fl-rust-ts/node_modules/.bin/tsc" >> "$GITHUB_ENV"
          echo "FORKLAUNCH_TEST_VALIDATOR_DEPENDENCIES=$RUNNER_TEMP/fl-rust-ts" >> "$GITHUB_ENV"
          echo "FORKLAUNCH_TEST_BETTER_AUTH_DEPENDENCIES=$RUNNER_TEMP/fl-rust-ts" >> "$GITHUB_ENV"
          echo "FORKLAUNCH_TEST_EXPRESS_DEPENDENCIES=$RUNNER_TEMP/fl-rust-ts" >> "$GITHUB_ENV"
          echo "FORKLAUNCH_TEST_SCALAR_DEPENDENCIES=$RUNNER_TEMP/fl-rust-ts" >> "$GITHUB_ENV"
          echo "FORKLAUNCH_TEST_ORM_DEPENDENCIES=$RUNNER_TEMP/fl-rust-ts" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust build cache
        uses: ./.github/actions/rust-build-cache
        with:
          family: blueprint-rs-${{ matrix.shard }}
          fallback-family: blueprint-rs-core
          size: 1500M
          free-disk: 'true'
          stable-tmp: 'true'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --before="$(date -u -d '2 days ago' +%Y-%m-%dT%H:%M:%SZ)" --prefix "$RUNNER_TEMP/fl-rust-ts" --no-save --package-lock=false --ignore-scripts typescript@5.9.3 @types/node@26.6.5 @sinclair/typebox@0.34.52 stripe@22.6.2 zod@4.6.5 ts-deepmerge@8.0.0 bullmq@6.3.10 ioredis@6.0.0 better-auth@1.7.6 @better-auth/memory-adapter@1.7.6 @better-auth/core@1.7.6 @better-auth/utils@0.4.2 @opentelemetry/api@1.9.1 @mikro-orm/core@7.2.3 @mikro-orm/postgresql@7.2.3 @forklaunch/better-auth-mikro-orm-fork@0.5.11 express@5.2.1 @scalar/express-api-reference@0.10.25 esbuild@0.28.2 ajv@8.20.0 ajv-draft-04@1.0.0 ajv-formats@3.0.1 qs@6.16.0 @types/qs@6.15.1
      - name: Check configured mapper and service source types
        run: |
          mkdir -p "$RUNNER_TEMP/fl-configured-mappers-types"
          cp framework-rs/parity/fixtures/configured-mappers-types/package*.json "$RUNNER_TEMP/fl-configured-mappers-types/"
          npm ci --prefix "$RUNNER_TEMP/fl-configured-mappers-types" --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/fl-configured-mappers-runtime"
          cp framework-rs/parity/fixtures/canonical-iam/package*.json "$RUNNER_TEMP/fl-configured-mappers-runtime/"
          npm ci --prefix "$RUNNER_TEMP/fl-configured-mappers-runtime" --ignore-scripts --no-audit --no-fund
          node framework-rs/parity/rust_configured_mappers_types.mjs
          node framework-rs/parity/rust_configured_mappers_types.mjs --sdk
        env:
          FORKLAUNCH_CONFIGURED_TYPES_PREFIX: ${{ runner.temp }}/fl-configured-mappers-types
          FORKLAUNCH_CONFIGURED_TYPES_RUNTIME_PREFIXES: '["${{ runner.temp }}/fl-configured-mappers-runtime","${{ runner.temp }}/fl-rust-ts"]'
      - name: Install isolated Chromium relay fixture
        run: |
          npm install --before="$(date -u -d '2 days ago' +%Y-%m-%dT%H:%M:%SZ)" --prefix "$RUNNER_TEMP/fl-rust-browser" --no-save --package-lock=false --ignore-scripts playwright-core@1.62.1
          node "$RUNNER_TEMP/fl-rust-browser/node_modules/playwright-core/cli.js" install --with-deps chromium
        if: matrix.shard == 'billing' # shard
      - run: node framework-rs/parity/rust_oidc_relay.mjs
        if: matrix.shard == 'billing' # shard
      - run: node framework-rs/parity/rust_iam_oidc_browser_relay.mjs
        env:
          PLAYWRIGHT_CORE_PATH: ${{ runner.temp }}/fl-rust-browser/node_modules/playwright-core
        if: matrix.shard == 'billing' # shard
      - run: node framework-rs/parity/rust_worker_tenant_scope_parity.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
        if: matrix.shard == 'billing' # shard
      - run: node framework-rs/parity/rust_cac_provider_parity.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
