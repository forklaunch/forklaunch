      - name: Bound Plan read HTTP, MCP and both SDKs
        run: node framework-rs/parity/rust_billing_bound_plan_read_runtime.mjs
        if: matrix.shard == 'billing' # shard
      - name: Bound Subscription read HTTP, MCP and both SDKs
        run: node framework-rs/parity/rust_billing_bound_subscription_read_runtime.mjs
        if: matrix.shard == 'billing' # shard
      - name: Bound PaymentLink read HTTP, MCP and both SDKs
        run: node framework-rs/parity/rust_billing_bound_payment_link_read_runtime.mjs
        if: matrix.shard == 'billing' # shard
      - name: Bound PaymentLink creation HTTP, MCP and both SDKs
        run: node framework-rs/parity/rust_billing_bound_payment_link_creation_runtime.mjs
        if: matrix.shard == 'billing' # shard
      - name: Bound Plan creation HTTP, MCP and both SDKs
        run: node framework-rs/parity/rust_billing_bound_plan_creation_runtime.mjs
        if: matrix.shard == 'billing' # shard
      - name: Bound Subscription recovery HTTP, MCP and both SDKs
        run: node framework-rs/parity/rust_billing_bound_subscription_recovery_runtime.mjs
        if: matrix.shard == 'billing' # shard
      - name: Configured Checkout and PaymentLink cached reads
        run: |
          cargo test --manifest-path blueprint-rs/Cargo.toml -p forklaunch-billing-stripe --test configured_cached_reads
          cargo test --manifest-path blueprint-rs/Cargo.toml -p forklaunch-billing-stripe --features bound-checkout --test http_configured_cached_reads -- --ignored --nocapture --test-threads=1
        if: matrix.shard == 'billing' # shard
      - name: Configured PaymentLink update preflight, coercion, HTTP and MCP
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
        run: |
          cargo test --manifest-path blueprint-rs/Cargo.toml -p forklaunch-billing-stripe --test configured_payment_link_update
          cargo test --manifest-path blueprint-rs/Cargo.toml -p forklaunch-billing-stripe --features bound-checkout,typescript-routing --test http_configured_payment_link_update -- --ignored --nocapture --test-threads=1
