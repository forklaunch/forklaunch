        run: cargo test --manifest-path blueprint-rs/Cargo.toml -p forklaunch-billing-stripe --features postgres-identity --test bound_portal_reads -- --ignored --nocapture --test-threads=1
        if: matrix.shard == 'billing' # shard
      - name: Stored Portal local expiration, immutable history and uncertain commit PostgreSQL checks
        run: cargo test --manifest-path blueprint-rs/Cargo.toml -p forklaunch-billing-stripe --features postgres-identity --test bound_portal_expiration -- --ignored --nocapture --test-threads=1
        if: matrix.shard == 'billing' # shard
      - name: Bound Plan read provenance, provider and race PostgreSQL checks
        run: cargo test --manifest-path blueprint-rs/Cargo.toml -p forklaunch-billing-stripe --features postgres-identity --test bound_plan_reads -- --ignored --nocapture --test-threads=1
        if: matrix.shard == 'billing' # shard
