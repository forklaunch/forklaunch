name: Rust Framework Parity

# Nightly and on demand only: the parity suites compare the Rust crates with
# their TypeScript counterparts, which pull requests do not need to wait for.
# The scripts live in framework-rs/parity.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

# actions: read lets the compiler-cache steps find and download earlier
# runs' store artifacts.
permissions:
  contents: read
  actions: read

jobs:
  # Both parity jobs run as parallel shards; which steps belong to which
  # shard is data in .github/workflows/scripts/parity_shards.py, which also
  # writes the `matrix.shard` conditions below (run it after adding steps).
  framework:
    name: framework (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [core, http, zod]
    # The V8 date oracle reads TZ through the host zoneinfo. Ubuntu 26.04's
    # tzdata-legacy names (e.g. Eire) resolve differently in Node's ICU than the
    # pinned 2025b rules; 24.04's zoneinfo matches them.
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/framework-rs/target
      # Full debuginfo across every feature-set test binary exhausts the
      # runner disk; line tables keep file:line in panics and backtraces.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      FORKLAUNCH_TEST_REDIS_URL: redis://127.0.0.1:6379/
      FORKLAUNCH_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      # Loads .github/actions/rust-build-cache/stable-tmp/preload.cjs once the
      # cache step has set FORKLAUNCH_STABLE_TMP_PRELOAD; a no-op before that.
      # Set here because GitHub refuses NODE_OPTIONS through GITHUB_ENV.
      NODE_OPTIONS: --import=data:text/javascript,if(process.env.FORKLAUNCH_STABLE_TMP_PRELOAD){(await(import(%22node:module%22))).createRequire(process.env.FORKLAUNCH_STABLE_TMP_PRELOAD)(process.env.FORKLAUNCH_STABLE_TMP_PRELOAD)}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Compiled output comes from the shared sccache store; only the
      # registry is cached per workspace.
      - name: Rust build cache
        uses: ./.github/actions/rust-build-cache
        with:
          family: framework-rs-${{ matrix.shard }}
          fallback-family: framework-rs-core
          size: 1500M
          free-disk: 'true'
          stable-tmp: 'true'
      - name: Start isolated S3-compatible storage
        run: |
          docker run -d --name forklaunch-rust-s3 --memory 512m \
            --tmpfs /data:rw,size=128m,mode=1777 -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=parity-test-access -e MINIO_ROOT_PASSWORD=parity-test-secret-only \
            cgr.dev/chainguard/minio@sha256:6476f81b9739912fa9f50ceae2bb049a30336527cccd24beccfbeb4145f8f696 \
            server /data --address :9000
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready; then exit 0; fi
            sleep 1
          done
          docker logs forklaunch-rust-s3
          exit 1
      - run: python3 scripts/rust_format.py framework-rs/Cargo.toml
        if: matrix.shard == 'core' # shard
      - run: cargo clippy --manifest-path framework-rs/Cargo.toml --workspace --all-targets --all-features -- -D warnings
        if: matrix.shard == 'core' # shard
      - run: cargo doc --manifest-path framework-rs/Cargo.toml --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        if: matrix.shard == 'core' # shard
      - name: Framework tests and reviewed OpenAPI / SDK snapshots
        run: cargo test --manifest-path framework-rs/Cargo.toml --workspace --all-features
        if: matrix.shard == 'core' # shard
      - run: CARGO_TARGET_DIR=framework-rs/target cargo test --manifest-path framework-rs/crates/vendor/referencing/Cargo.toml --locked --lib
        if: matrix.shard == 'core' # shard
      - run: CARGO_TARGET_DIR=framework-rs/target cargo test --manifest-path framework-rs/crates/vendor/referencing/Cargo.toml --locked --lib --features forklaunch-ajv-pointer-decoding
        if: matrix.shard == 'core' # shard
      - run: CARGO_TARGET_DIR=framework-rs/target cargo test --manifest-path framework-rs/crates/vendor/jsonschema/Cargo.toml --locked --lib --no-default-features --features idna -- --skip validator::tests::validate_ref
        if: matrix.shard == 'core' # shard
      - run: CARGO_TARGET_DIR=framework-rs/target cargo test --manifest-path framework-rs/crates/vendor/referencing/Cargo.toml --locked --lib --features 'forklaunch-static-anchor-resolution forklaunch-ajv-ref-siblings forklaunch-legacy-fragment-ids'
        if: matrix.shard == 'core' # shard
      - run: CARGO_TARGET_DIR=framework-rs/target cargo test --manifest-path framework-rs/crates/vendor/jsonschema/Cargo.toml --locked --lib --no-default-features --features 'idna forklaunch-static-anchor-resolution' -- --skip validator::tests::validate_ref
        if: matrix.shard == 'core' # shard
      - name: AJV sibling compatibility profile (default-profile assertions run above)
        run: >-
          CARGO_TARGET_DIR=framework-rs/target cargo test
          --manifest-path framework-rs/crates/vendor/jsonschema/Cargo.toml --locked --lib
          --no-default-features --features 'idna forklaunch-ajv-ref-siblings forklaunch-static-anchor-resolution forklaunch-legacy-fragment-ids' --
          --skip validator::tests::validate_ref
          --skip evaluation::tests::ref_siblings_produce_no_annotations
          --skip keywords::discriminator::tests::draft7_ignores_pins_beside_a_reference
          --skip keywords::discriminator::tests::unpinned_value_is_not_dispatched::test_case_3_const_beside_a_reference_in_draft_7
          --skip tests::absolute_keyword_location_in_nested_resource::test_case_10_draft_7_id_beside_ref_names_no_resource
          --skip tests::custom_meta_schema_preserves_underlying_draft_behavior
        if: matrix.shard == 'core' # shard
      - run: cargo test --manifest-path framework-rs/Cargo.toml -p forklaunch-infrastructure-redis --all-features redis_backend -- --ignored
        if: matrix.shard == 'core' # shard
      - run: cargo test --manifest-path framework-rs/Cargo.toml -p forklaunch-infrastructure-s3 --all-features s3_backend -- --ignored
        if: matrix.shard == 'core' # shard
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --before="$(date -u -d '2 days ago' +%Y-%m-%dT%H:%M:%SZ)" --prefix "$RUNNER_TEMP/fl-rust-ts" --no-save --package-lock=false --ignore-scripts typescript@5.9.3 qs@6.16.0 @types/qs@6.15.1 @asyncapi/parser@3.6.3 ajv@8.20.0 ajv-draft-04@1.0.0 ajv-formats@3.0.1 @types/ws@8.18.1 @types/node@26.6.5 cross-fetch@4.1.0 zod@4.6.5 ts-deepmerge@8.0.0 ws@8.22.0 @tanstack/react-query@5.104.2 @tanstack/query-core@5.104.2 react@19.2.4 @types/react@19.3.0
      - run: node framework-rs/parity/rust_common_naming.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
          FORKLAUNCH_TEST_VALIDATOR_DEPENDENCIES: ${{ runner.temp }}/fl-rust-ts
        if: matrix.shard == 'core' # shard
      - name: Smoke all six native runtime benchmarks
        run: node framework-rs/parity/rust_benchmarks.mjs --debug --require-infra
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
          FORKLAUNCH_BENCH_ITERATIONS: '20'
          FORKLAUNCH_BENCH_WARMUP: '5'
          FORKLAUNCH_BENCH_REDIS_URL: redis://127.0.0.1:6379/
          FORKLAUNCH_BENCH_S3: '1'
          FORKLAUNCH_BENCH_CREATE_BUCKET: '1'
          S3_URL: http://127.0.0.1:9000
          S3_REGION: us-east-1
          S3_BUCKET: forklaunch-bench
          S3_ACCESS_KEY_ID: parity-test-access
          S3_SECRET_ACCESS_KEY: parity-test-secret-only
          FORKLAUNCH_BENCH_OUTPUT: ${{ runner.temp }}/rust-benchmark-smoke.json
        if: matrix.shard == 'core' # shard
      - uses: actions/upload-artifact@v7
        with:
          name: rust-benchmark-smoke
          path: ${{ runner.temp }}/rust-benchmark-smoke.json
        if: matrix.shard == 'core' # shard
      - name: Remove isolated S3 storage
        if: always()
        run: docker rm -f forklaunch-rust-s3 || true
      - run: node framework-rs/parity/rust_redis_queue_parity.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
        if: matrix.shard == 'http' # shard
      - run: node framework-rs/parity/rust_retention_hooks_parity.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
        if: matrix.shard == 'http' # shard
      - run: node framework-rs/parity/rust_json_cache_parity.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
        if: matrix.shard == 'http' # shard
      - run: node framework-rs/parity/rust_json_object_parity.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
        if: matrix.shard == 'http' # shard
      - run: node framework-rs/parity/rust_s3_environment_parity.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
        if: matrix.shard == 'http' # shard
      - run: node framework-rs/parity/rust_otlp_runtime.mjs
        if: matrix.shard == 'http' # shard
      - run: node framework-rs/parity/rust_asyncapi_parity.mjs
        env:
          ASYNCAPI_PARSER_PATH: ${{ runner.temp }}/fl-rust-ts/node_modules/@asyncapi/parser
        if: matrix.shard == 'http' # shard
      - run: node framework-rs/parity/rust_asyncapi_correlation.mjs
        env:
          ASYNCAPI_PARSER_PATH: ${{ runner.temp }}/fl-rust-ts/node_modules/@asyncapi/parser
        if: matrix.shard == 'http' # shard
      - run: node framework-rs/parity/rust_mcp_body_parity.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
        if: matrix.shard == 'http' # shard
      - run: node framework-rs/parity/rust_query_transport_parity.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
        if: matrix.shard == 'http' # shard
      - run: |
          mkdir -p "$RUNNER_TEMP/fl-canonical-http"
          cp framework-rs/parity/fixtures/canonical-iam/package*.json "$RUNNER_TEMP/fl-canonical-http/"
          npm ci --prefix "$RUNNER_TEMP/fl-canonical-http" --ignore-scripts --no-audit --no-fund
      - run: node framework-rs/parity/rust_canonical_http_parity.mjs
        env:
          FORKLAUNCH_TEST_CANONICAL_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
        if: matrix.shard == 'http' # shard
      - run: node framework-rs/parity/rust_router_origin_parity.mjs
        env:
          FORKLAUNCH_TEST_CANONICAL_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
        if: matrix.shard == 'http' # shard
      - run: node framework-rs/parity/rust_correlation_parity.mjs
        env:
          FORKLAUNCH_TEST_CANONICAL_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
        if: matrix.shard == 'http' # shard
      - run: node framework-rs/parity/rust_cors_parity.mjs
        env:
          FORKLAUNCH_TEST_CANONICAL_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
        if: matrix.shard == 'http' # shard
      - run: node framework-rs/parity/typescript_cors_origin_delegate_http.mjs
        env:
          FORKLAUNCH_TEST_CANONICAL_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
          FORKLAUNCH_CORS_DELEGATE_NATIVE: '1'
        if: matrix.shard == 'http' # shard
      - run: node framework-rs/parity/rust_json_request_parity.mjs
        env:
          FORKLAUNCH_TEST_CANONICAL_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
        if: matrix.shard == 'http' # shard
      - run: node framework-rs/parity/rust_request_order_parity.mjs
        env:
          FORKLAUNCH_TEST_CANONICAL_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
        if: matrix.shard == 'http' # shard
      - run: node framework-rs/parity/rust_request_transform_parity.mjs
        env:
          FORKLAUNCH_TEST_CANONICAL_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
        if: matrix.shard == 'http' # shard
      - run: node framework-rs/parity/rust_request_fields_parity.mjs
        env:
          FORKLAUNCH_TEST_CANONICAL_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
        if: matrix.shard == 'http' # shard
      - run: node framework-rs/parity/rust_response_warning_parity.mjs
        env:
          FORKLAUNCH_TEST_CANONICAL_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
        if: matrix.shard == 'http' # shard
      - run: node framework-rs/parity/rust_version_response_parity.mjs
        env:
          FORKLAUNCH_TEST_CANONICAL_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
        if: matrix.shard == 'http' # shard
      - run: node framework-rs/parity/rust_version_default_errors_parity.mjs
        env:
          FORKLAUNCH_TEST_CANONICAL_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
        if: matrix.shard == 'http' # shard
      - run: node framework-rs/parity/rust_version_json_wire_parity.mjs
        env:
          FORKLAUNCH_TEST_CANONICAL_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
        if: matrix.shard == 'http' # shard
      - run: node framework-rs/parity/rust_zod_diagnostic_provenance.mjs
        env:
          FORKLAUNCH_DIAGNOSTIC_NATIVE: 1
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
          FORKLAUNCH_TEST_VALIDATOR_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
        if: matrix.shard == 'http' # shard
      - run: node framework-rs/parity/rust_version_json_wire_parity.mjs
        env:
          FORKLAUNCH_DIAGNOSTIC_NATIVE: 1
          FORKLAUNCH_TEST_CANONICAL_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
        if: matrix.shard == 'http' # shard
      - run: node framework-rs/parity/rust_version_text_wire_parity.mjs
        env:
          FORKLAUNCH_TEST_CANONICAL_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
        if: matrix.shard == 'http' # shard
      - run: node framework-rs/parity/rust_version_request_parser_diagnostics.mjs
        env:
          FORKLAUNCH_VERSION_REQUEST_NATIVE: 1
          FORKLAUNCH_TEST_CANONICAL_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
        if: matrix.shard == 'http' # shard
      - run: node framework-rs/parity/rust_version_optional_body_parity.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
          FORKLAUNCH_TEST_CANONICAL_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
        if: matrix.shard == 'http' # shard
      - run: node framework-rs/parity/rust_mcp_body_admission_parity.mjs
        env:
          FORKLAUNCH_TEST_CANONICAL_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
        if: matrix.shard == 'http' # shard
      - run: node framework-rs/parity/ts_response_header_arrays.mjs
        env:
          FORKLAUNCH_TEST_CANONICAL_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
        if: matrix.shard == 'http' # shard
      - run: node framework-rs/parity/rust_simple_query_parity.mjs
        env:
          FORKLAUNCH_TEST_CANONICAL_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
        if: matrix.shard == 'http' # shard
      - run: node framework-rs/parity/rust_version_query_parity.mjs
        env:
          FORKLAUNCH_TEST_CANONICAL_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
        if: matrix.shard == 'http' # shard
      - run: node framework-rs/parity/ts_version_request_diagnostics.mjs
        env:
          FORKLAUNCH_TEST_CANONICAL_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
          FORKLAUNCH_VERSION_DIAGNOSTICS_NATIVE: '1'
        if: matrix.shard == 'http' # shard
      - run: node framework-rs/parity/ts_version_request_diagnostics.mjs
        env:
          FORKLAUNCH_TEST_CANONICAL_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
          FORKLAUNCH_VERSION_DIAGNOSTICS_NATIVE: '1'
          FORKLAUNCH_VERSION_PREAUTH: '1'
        if: matrix.shard == 'http' # shard
      - run: node framework-rs/parity/rust_zod_string_parity.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
          FORKLAUNCH_TEST_VALIDATOR_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
          FORKLAUNCH_TEST_CANONICAL_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
        if: matrix.shard == 'zod' # shard
      - run: node framework-rs/parity/rust_zod_string_rules_parity.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
          FORKLAUNCH_TEST_VALIDATOR_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
          FORKLAUNCH_TEST_CANONICAL_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
        if: matrix.shard == 'zod' # shard
      - run: node framework-rs/parity/rust_zod_string_formats_parity.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
          FORKLAUNCH_TEST_VALIDATOR_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
          FORKLAUNCH_TEST_CANONICAL_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
        if: matrix.shard == 'zod' # shard
      - run: node framework-rs/parity/rust_zod_binary_parity.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
          FORKLAUNCH_TEST_VALIDATOR_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
          FORKLAUNCH_TEST_CANONICAL_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
        if: matrix.shard == 'zod' # shard
      - run: node framework-rs/parity/rust_zod_json_parity.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
          FORKLAUNCH_TEST_VALIDATOR_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
          FORKLAUNCH_TEST_CANONICAL_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
        if: matrix.shard == 'zod' # shard
      - run: node framework-rs/parity/rust_zod_ordered_json_parity.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
          FORKLAUNCH_TEST_VALIDATOR_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
        if: matrix.shard == 'zod' # shard
      - run: node framework-rs/parity/rust_zod_record_json_parity.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
          FORKLAUNCH_TEST_VALIDATOR_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
        if: matrix.shard == 'zod' # shard
      - run: node framework-rs/parity/rust_zod_absence_json_parity.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
          FORKLAUNCH_TEST_VALIDATOR_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
        if: matrix.shard == 'zod' # shard
      - run: node framework-rs/parity/rust_zod_object_policy_parity.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
          FORKLAUNCH_TEST_VALIDATOR_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
        if: matrix.shard == 'zod' # shard
      - run: node framework-rs/parity/rust_zod_tuple_json_parity.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
          FORKLAUNCH_TEST_VALIDATOR_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
        if: matrix.shard == 'zod' # shard
      - run: node framework-rs/parity/rust_json_composition_runtime.mjs
        env:
          FORKLAUNCH_TEST_CANONICAL_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
        if: matrix.shard == 'zod' # shard
      - name: Pin Node and Ada for WHATWG URL compatibility checks
        uses: actions/setup-node@v4
        with:
          node-version: '24.2.0'
      # Node's ICU validates TZ against the host zoneinfo. Ubuntu moved legacy
      # zone names (CET, EST5EDT, US/*, ...) to tzdata-legacy, and without
      # them TZ=CET silently becomes UTC in the oracle.
      - name: Install legacy zone names for the V8 date oracle
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tzdata-legacy
      - run: node framework-rs/parity/rust_v8_date_parity.mjs
        env:
          CARGO_TARGET_DIR: framework-rs/target
        if: matrix.shard == 'zod' # shard
      - run: npm install --before="$(date -u -d '2 days ago' +%Y-%m-%dT%H:%M:%SZ)" --prefix "$RUNNER_TEMP/fl-canonical-http" --no-save --package-lock=false --ignore-scripts punycode@2.3.1
      - run: node framework-rs/parity/rust_zod_uri_parity.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
          FORKLAUNCH_TEST_VALIDATOR_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
        if: matrix.shard == 'zod' # shard
      - run: node framework-rs/parity/rust_zod_uri_openapi.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
          FORKLAUNCH_TEST_VALIDATOR_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
        if: matrix.shard == 'zod' # shard
      - run: node framework-rs/parity/rust_zod_factory_string_composition.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
          FORKLAUNCH_TEST_VALIDATOR_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
          FORKLAUNCH_FACTORY_STRING_NATIVE: '1'
        if: matrix.shard == 'zod' # shard
      - run: node framework-rs/parity/rust_zod_uri_sdk.mjs
        env:
          TSC_BIN: ${{ runner.temp }}/fl-rust-ts/node_modules/.bin/tsc
          FORKLAUNCH_TEST_VALIDATOR_DEPENDENCIES: ${{ runner.temp }}/fl-canonical-http
          FORKLAUNCH_TEST_SOCKET_DEPENDENCIES: ${{ runner.temp }}/fl-rust-ts
        if: matrix.shard == 'zod' # shard
      - run: cargo test --locked --manifest-path framework-rs/Cargo.toml -p forklaunch-common --all-features
        if: matrix.shard == 'zod' # shard
      - run: cargo test --locked --manifest-path framework-rs/crates/vendor/regress/Cargo.toml --features utf16
        if: matrix.shard == 'zod' # shard
      - run: cargo test --locked --manifest-path framework-rs/crates/vendor/regress/Cargo.toml --no-default-features --features std,utf16 --lib --test forklaunch_budget
