        run: |
          cargo test --manifest-path blueprint-rs/Cargo.toml -p forklaunch-billing-stripe --test configured_subscription_update
          cargo test --manifest-path blueprint-rs/Cargo.toml -p forklaunch-billing-stripe --features bound-checkout --test http_configured_subscription_update -- --ignored --nocapture --test-threads=1
        if: matrix.shard == 'billing' # shard
