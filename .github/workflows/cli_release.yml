# CLI release. Two ways in:
#   - push a cli-vX.Y.Z tag on a main commit, or
#   - run this workflow from main with version=X.Y.Z and release=true: it creates
#     the tag on the dispatched commit after the preflight and builds pass.
# A dispatch with release=false only builds (no tag, GitHub release or publish).
# Preflight: the commit is on main, the CLI's generated npm/Cargo versions match
# the framework and blueprint workspaces, and every Rust crate version the CLI
# generates is already on crates.io.
name: CLI Release

permissions:
  contents: write
  packages: write

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without prefix (e.g. 1.35.0). Required when release=true'
        required: false
        default: ''
      release:
        description: 'Create tag cli-vVERSION on this main commit, publish the GitHub release, npm and crates.io'
        type: boolean
        default: false

jobs:
  resolve_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_RELEASE: ${{ github.event.inputs.release }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "version=${GITHUB_REF_NAME#cli-v}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$INPUT_VERSION"
          if [[ -z "$version" ]]; then
            latest=$(git tag -l "cli-v*" | sort -V | tail -1)
            version="${latest#cli-v}"
          fi
          version="${version#cli-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be X.Y.Z, got '$version'"; exit 1; }
          if [[ "$INPUT_RELEASE" == "true" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::release=true runs from main only"; exit 1; }
            if existing=$(git rev-parse --verify --quiet "refs/tags/cli-v$version^{commit}"); then
              [[ "$existing" == "$GITHUB_SHA" ]] || { echo "::error::cli-v$version already exists on another commit"; exit 1; }
            fi
            latest=$(git tag -l "cli-v*" | sort -V | tail -1)
            if [[ -n "$latest" && "cli-v$version" != "$latest" ]] && [[ "$(printf '%s\n%s\n' "$latest" "cli-v$version" | sort -V | tail -1)" != "cli-v$version" ]]; then
              echo "::error::cli-v$version is not above the latest release $latest"; exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  preflight:
    needs: resolve_version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Commit is on main
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA is not on main"; exit 1; }
      - name: Generated versions match the framework and blueprint
        working-directory: .github/workflows/scripts/check_blueprint_deps
        run: cargo run --quiet -- --rust-released
      - name: Generated Rust crate versions are on crates.io
        run: python3 scripts/rust_release.py check-published --scope all

  build:
    needs: [resolve_version, preflight]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: forklaunch-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: forklaunch-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: forklaunch-darwin-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: forklaunch-darwin-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: forklaunch-windows-x86_64.exe

    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Update Cargo.toml version
        working-directory: cli
        run: |
          cargo install cargo-edit
          cargo set-version ${{ needs.resolve_version.outputs.version }}
      
      - name: Install cross-compilation tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          fi
          sudo apt-get install -y pkg-config libssl-dev
      
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('cli/Cargo.lock') }}
      
      - name: Build CLI
        working-directory: cli
        run: cargo build --release --target ${{ matrix.target }}
      
      - name: Prepare artifact (Unix)
        if: matrix.os != 'windows-latest'
        working-directory: cli
        run: |
          cp target/${{ matrix.target }}/release/forklaunch ${{ matrix.artifact }}
          strip ${{ matrix.artifact }} || true
      
      - name: Prepare artifact (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: cli
        run: |
          copy target\${{ matrix.target }}\release\forklaunch.exe ${{ matrix.artifact }}
      
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: cli/${{ matrix.artifact }}

  tag:
    needs: [resolve_version, build]
    if: needs.resolve_version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create the release tag on the built commit (dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: cli-v${{ needs.resolve_version.outputs.version }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already on $GITHUB_SHA"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

  upload-assets:
    needs: [resolve_version, tag]
    runs-on: ubuntu-latest
    if: needs.resolve_version.outputs.publish == 'true'
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: cli-v${{ needs.resolve_version.outputs.version }}
          name: cli-v${{ needs.resolve_version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/*/forklaunch-*

  npm-publish:
    needs: [build, resolve_version, tag]
    if: needs.resolve_version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
        with:
          # Publish the same triggering commit used by the binary build jobs.
          # main may advance while the release matrix is still compiling.
          ref: ${{ github.sha }}
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '25'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Update package.json version
        working-directory: cli
        run: |
          npm version ${{ needs.resolve_version.outputs.version }} --no-git-tag-version
      
      - name: Update Cargo.toml version
        working-directory: cli
        run: |
          cargo install cargo-edit
          cargo set-version ${{ needs.resolve_version.outputs.version }}

      - name: Publish to npm
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Publish to crates.io
        working-directory: cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: cargo publish --allow-dirty

        
